<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Authenticating | MindStream</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background-color: #0A192F;
        color: #F8F9FA;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .title {
        font-size: 16px;
        font-weight: 600;
        margin: 0 0 6px 0;
      }
      .subtitle {
        font-size: 13px;
        color: #94a3b8;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <p class="title">Completing Sign In...</p>
    <p class="subtitle">This window will close automatically once authentication finishes.</p>
    <script>
      (function() {
        var hash = window.location.hash || '';
        var search = window.location.search || '';

        if (window.opener && !window.opener.closed) {
          try {
            window.opener.postMessage({
              type: 'OAUTH_AUTH_SUCCESS',
              hash: hash,
              search: search
            }, window.location.origin);
          } catch (e) {
            // Silently ignore postMessage dispatch errors
          }
          setTimeout(function() {
            window.close();
          }, 600);
        } else {
          // If opened without an opener, safely redirect to the main app
          window.location.replace('/' + (hash || search));
        }
      })();
    </script>
  </body>
</html>
